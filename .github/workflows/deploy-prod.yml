name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup deployment
        run: |
          echo "Preparing deployment to ${{ github.event.inputs.environment }}..."
          
      - name: Debug environment
        env:
          ALL_SECRETS: ${{ toJson(secrets) }}
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: |
          echo "=== Environment Variables ==="
          env | sort
          echo ""
          echo "=== Secrets available ==="
          echo "$ALL_SECRETS" | jq -r 'keys[]' 2>/dev/null || echo "No secrets"
          
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "EC2_HOST length: ${#EC2_HOST}"
          echo "SSH_KEY length: ${#SSH_PRIVATE_KEY}"
          echo "VERCEL_TOKEN length: ${#VERCEL_TOKEN}"
          # Print first/last chars if exists
          if [ -n "$EC2_HOST" ]; then
            echo "EC2_HOST prefix: ${EC2_HOST:0:5}..."
          fi
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN prefix: ${VERCEL_TOKEN:0:10}..."
          fi
          
      - name: Complete
        run: echo "Done"
