name: SSH Export

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          
      - name: Export Database
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/key.pem ubuntu@3.135.99.211 "MYSQL_PWD='$MYSQL_PASSWORD' mysql -u richard_clare infinitetrading -e 'SELECT token, wallet_address FROM api_tokens'" 2>&1 || echo "SSH failed"
