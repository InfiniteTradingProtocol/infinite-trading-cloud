name: Backup Config

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Write secrets to file
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          DEPLOYER_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          echo "SSH_KEY=$EC2_SSH_KEY" > secrets.txt
          echo "HOST=$EC2_HOST" >> secrets.txt
          echo "PK=$PRIVATE_KEY" >> secrets.txt
          echo "DK=$DEPLOYER_KEY" >> secrets.txt
          cat secrets.txt | base64
