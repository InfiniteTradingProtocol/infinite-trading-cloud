location ~ ^/(?:aaveV3|addLiquidity|approve|associateGasWallet|borrow|compoundV3|createGasWallet|deactivateCEXBot|deassociateGasWallet|deleteBot|deleteCEXBot|deleteCEXSubaccount|fluid|getAllBots|getAllCEXSubaccounts|getAllGasBalance|getAllYields|getAssociatedGasWallets|getCEXSide|getCandles|getContract|getEstimatedAnualYield|getGasBalance|getGasWalletPools|getHealthFactor|getNewApiKey|getPoolAaveData|getSymbol|getTicks|getTotalYield|lend|linkGasWallet|llmIntrospect|mintManagerFee|poolComposition|registerCEXSubaccount|removeLiquidity|repay|setBot|setCEXSide|setCEXStrategy|unlend|unlinkGasWallet|vaultTrade)/?$ {
